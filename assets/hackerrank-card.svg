<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" fill="none">
  <defs>
    <linearGradient id="hrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EC866"/>
      <stop offset="100%" stop-color="#00EA64"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <style>
    .title { font-family: 'Segoe UI', Ubuntu, 'Fira Code', sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .subtitle { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 12px; fill: #2EC866; font-weight: 600; }
    .score-num { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 26px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .score-label { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; fill: #9CA3AF; text-anchor: middle; }
    .badge-title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 12px; font-weight: 600; fill: #E5E7EB; }
    .badge-desc { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; fill: #9CA3AF; }
    .stat-pill { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 10px; font-weight: 700; fill: #2EC866; }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="478" height="188" rx="12" fill="#0E1117" stroke="#2EC866" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- HackerRank Logo & Header -->
  <g transform="translate(20, 16)">
    <!-- HackerRank H Hexagon Icon -->
    <rect width="28" height="28" rx="6" fill="#2EC866"/>
    <path d="M9 7h3v5h4V7h3v14h-3v-6h-4v6H9V7z" fill="#0E1117"/>
    
    <text x="36" y="15" class="title">Gubba Nithish</text>
    <text x="36" y="27" class="subtitle">@gubbanithish9 • HackerRank</text>
  </g>

  <!-- Score Circle (Left) -->
  <g transform="translate(75, 115)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="42" stroke="#1F2937" stroke-width="7" fill="none"/>
    <!-- Progress Circle (50% progress for 15/30 pts) -->
    <circle cx="0" cy="0" r="42" stroke="url(#hrGrad)" stroke-width="7" stroke-linecap="round" fill="none"
            stroke-dasharray="264" stroke-dashoffset="132" transform="rotate(-90)" filter="url(#glow)"/>
    
    <text x="0" y="2" class="score-num">15</text>
    <text x="0" y="18" class="score-label">PTS SCORE</text>
  </g>

  <!-- Badges & Track Details (Right) -->
  <g transform="translate(155, 62)">
    <!-- Badge 1: Problem Solving -->
    <g transform="translate(0, 0)">
      <rect width="295" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <!-- Icon/Dot -->
      <circle cx="16" cy="16" r="5" fill="#2EC866"/>
      <text x="30" y="17" class="badge-title">Problem Solving</text>
      <text x="145" y="17" class="badge-desc">Data Structures (3 Solved)</text>
      <text x="282" y="17" class="stat-pill" text-anchor="end">15 PTS</text>
    </g>

    <!-- Badge 2: Java Proficiency -->
    <g transform="translate(0, 38)">
      <rect width="295" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="16" cy="16" r="5" fill="#FFA116"/>
      <text x="30" y="17" class="badge-title">Java</text>
      <text x="75" y="17" class="badge-desc">Language Proficiency Track</text>
      <text x="282" y="17" class="stat-pill" fill="#FFA116" text-anchor="end">ACTIVE</text>
    </g>

    <!-- Badge 3: React & Algorithms Progress -->
    <g transform="translate(0, 76)">
      <rect width="295" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="16" cy="16" r="5" fill="#38BDF8"/>
      <text x="30" y="17" class="badge-title">Next Star Target</text>
      <text x="135" y="17" class="badge-desc">15 / 30 Pts to 1st Star</text>
      <text x="282" y="17" class="stat-pill" fill="#38BDF8" text-anchor="end">50%</text>
    </g>
  </g>
</svg>
